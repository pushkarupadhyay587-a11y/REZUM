<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rezum | Resume ranking</title>
  <style>
    :root { --ink: #1f2933; --muted: #697586; --line: #d8dee6; --accent: #e06b38; --accent-dark: #b95125; --paper: #fbfaf7; --wash: #eef4f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(circle at 90% 0%, #f8dcc4 0, transparent 34%), var(--paper); font: 16px/1.5 Georgia, serif; }
    main { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 58px 0 80px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 38px; }
    .eyebrow { color: var(--accent-dark); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    h1 { margin: 8px 0 0; font-size: clamp(38px, 7vw, 72px); line-height: .98; font-weight: 500; letter-spacing: -2px; }
    .intro { max-width: 250px; margin: 0; color: var(--muted); font: 15px/1.5 Arial, sans-serif; }
    .panel { padding: clamp(20px, 4vw, 40px); border: 1px solid var(--line); background: rgba(255,255,255,.82); box-shadow: 0 18px 55px rgba(57, 72, 83, .08); }
    label { display: block; margin-bottom: 9px; font: 700 13px Arial, sans-serif; }
    textarea { display: block; width: 100%; min-height: 112px; padding: 14px; resize: vertical; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); background: #fff; font: 16px/1.5 Arial, sans-serif; }
    textarea:focus { outline: 2px solid #f0b08c; border-color: var(--accent); }
    .dropzone { margin-top: 26px; padding: 30px 20px; border: 1.5px dashed #aab5c1; border-radius: 4px; background: var(--wash); text-align: center; transition: .2s ease; }
    .dropzone.active { border-color: var(--accent); background: #fff0e8; transform: translateY(-2px); }
    .dropzone strong { display: block; margin-bottom: 5px; font-size: 21px; font-weight: 500; }
    .dropzone p { margin: 0 0 18px; color: var(--muted); font: 14px Arial, sans-serif; }
    input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .pick, button { display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 3px; cursor: pointer; font: 700 14px Arial, sans-serif; }
    .pick { padding: 11px 17px; color: #fff; background: var(--ink); }
    .pick:hover, button:hover { background: #364452; }
    .file-list { display: grid; gap: 7px; margin: 18px 0 0; padding: 0; list-style: none; font: 14px Arial, sans-serif; }
    .file-list li { display: flex; justify-content: space-between; gap: 14px; padding: 9px 11px; background: #fff; border: 1px solid #e4e8ec; }
    .file-list span:last-child { color: var(--muted); white-space: nowrap; }
    button { width: 100%; margin-top: 26px; padding: 14px; color: #fff; background: var(--accent); }
    button:disabled { cursor: wait; opacity: .55; }
    .message { min-height: 22px; margin: 14px 0 0; color: var(--accent-dark); font: 14px Arial, sans-serif; }
    #results { display: grid; gap: 12px; margin-top: 32px; }
    .result { padding: 20px; border-left: 4px solid var(--accent); background: #fff; box-shadow: 0 8px 24px rgba(57,72,83,.06); }
    .result-top { display: flex; justify-content: space-between; gap: 15px; font: 700 15px Arial, sans-serif; }
    .score { color: var(--accent-dark); white-space: nowrap; }
    .result p, .result ul { margin: 10px 0 0; font: 14px/1.5 Arial, sans-serif; }
    .result ul { padding-left: 18px; color: var(--muted); }
    @media (max-width: 620px) { main { padding-top: 32px; } header { display: block; } .intro { margin-top: 18px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow">Rezum / candidate intelligence</div><h1>Find the right<br>resume faster.</h1></div>
      <p class="intro">Give Gemini a role and a shortlist. It will rank each resume with evidence you can inspect.</p>
    </header>
    <section class="panel">
      <form id="rank-form">
        <label for="role">Role or job description</label>
        <textarea id="role" name="role" placeholder="e.g. Senior backend engineer with Python, FastAPI, and PostgreSQL experience" required></textarea>
        <div id="dropzone" class="dropzone">
          <strong>Drop resumes here</strong>
          <p>PDF, DOCX, TXT, MD, or CSV. The selected resume will be saved before analysis.</p>
          <label class="pick" for="files">Choose files</label>
          <input id="files" name="files" type="file" accept=".pdf,.docx,.txt,.md,.csv" multiple>
          <ul id="file-list" class="file-list"></ul>
        </div>
        <button id="submit" type="submit">Rank resumes</button>
        <p id="message" class="message" role="status"></p>
      </form>
    </section>
    <section id="results" aria-live="polite"></section>
  </main>
  <script>
    const form = document.querySelector('#rank-form');
    const dropzone = document.querySelector('#dropzone');
    const fileInput = document.querySelector('#files');
    const fileList = document.querySelector('#file-list');
    const message = document.querySelector('#message');
    const results = document.querySelector('#results');
    let selectedFiles = [];

    function addFiles(files) {
      selectedFiles = files.slice(-1);
      fileList.innerHTML = selectedFiles.map(file => `<li><span>${escapeHtml(file.name)}</span><span>${Math.ceil(file.size / 1024)} KB</span></li>`).join('');
    }
    function escapeHtml(value) { return value.replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character])); }
    fileInput.addEventListener('change', event => addFiles([...event.target.files]));
    ['dragenter', 'dragover'].forEach(type => dropzone.addEventListener(type, event => { event.preventDefault(); dropzone.classList.add('active'); }));
    ['dragleave', 'drop'].forEach(type => dropzone.addEventListener(type, event => { event.preventDefault(); dropzone.classList.remove('active'); }));
    dropzone.addEventListener('drop', event => addFiles([...event.dataTransfer.files]));
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!selectedFiles.length) { message.textContent = 'Choose at least one resume.'; return; }
      const data = new FormData();
      data.append('role', document.querySelector('#role').value);
      data.append('file', selectedFiles[0]);
      document.querySelector('#submit').disabled = true;
      message.textContent = 'Analyzing resumes...'; results.innerHTML = '';
      try {
        const response = await fetch('/upload', { method: 'POST', body: data });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || 'Ranking failed.');
        message.textContent = `${payload.ranked_resumes.length} resume(s) ranked.`;
        results.innerHTML = payload.ranked_resumes.map(item => `<article class="result"><div class="result-top"><span>#${item.rank} ${escapeHtml(item.filename)}</span><span class="score">${item.score}/100</span></div><p>${escapeHtml(item.summary)}</p><strong>Strengths</strong><ul>${item.strengths.map(strength => `<li>${escapeHtml(strength)}</li>`).join('')}</ul><strong>Skills to consider adding</strong><ul>${item.suggested_skills.map(skill => `<li>${escapeHtml(skill)}</li>`).join('')}</ul><strong>Resume improvements</strong><ul>${item.improvement_suggestions.map(suggestion => `<li>${escapeHtml(suggestion)}</li>`).join('')}</ul></article>`).join('');
      } catch (error) { message.textContent = error.message; }
      finally { document.querySelector('#submit').disabled = false; }
    });
  </script>
</body>
</html>
